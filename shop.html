<style>
  .shop-header {
    padding: 60px 0 30px;
  }
  .shop-header h1 {
    font-size: 42px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  /* Filter Bar Styling */
  .filter-bar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .filter-btn {
    background: var(--surface-glass);
    border: 1px solid var(--surface-border);
    color: var(--muted);
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .filter-btn:hover,
  .filter-btn.active {
    background: var(--surface-hover);
    color: #ffffff;
    border-color: var(--surface-border-active);
    box-shadow: 0 0 15px var(--primary-glow);
  }

  /* Catalog Grid */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px;
  }

  .product-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }

  .product-badge {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--primary);
    background: rgba(255, 106, 43, 0.1);
    border: 1px solid rgba(255, 106, 43, 0.2);
    padding: 4px 10px;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .product-title {
    font-size: 20px;
    margin: 0 0 8px 0;
  }

  .product-price {
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 12px;
  }
